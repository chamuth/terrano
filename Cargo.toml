[package]
name = "terrano"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Terrain Generation and Procedural Asset Development Software for BeamNG.drive"
license = "MIT"

[dependencies]
# UI Framework - egui with wgpu backend
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
eframe = { version = "0.30", features = ["wgpu"] }

# Graphics - wgpu for modern GPU API
wgpu = "23.0"
winit = "0.30"

# Math
glam = "0.29"
nalgebra = "0.33"

# Noise generation
noise = "0.9"

# Image I/O
image = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
